<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGLY NOTES 💀</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Impact&display=swap" rel="stylesheet">
    <style>
        /* --- STYLE ANTI-DESIGN --- */
        :root {
            --neon-yellow: #FFFF00;
            --neon-pink: #FF00FF;
            --neon-blue: #0000FF;
            --acid-green: #00FF00;
            --ugly-bg: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--ugly-bg);
            font-family: 'Comic Neue', cursive;
            color: var(--neon-yellow);
            overflow-x: hidden;
            background-image: repeating-linear-gradient(
                45deg,
                #111,
                #111 10px,
                #222 10px,
                #222 20px
            );
        }

        /* Header yang Nge-Blast */
        .ugly-header {
            background: var(--neon-pink);
            color: var(--ugly-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 10px solid var(--neon-blue);
            transform: rotate(-1deg);
            box-shadow: 10px 10px 0px var(--acid-green);
        }

        .ugly-header h1 {
            font-family: 'Impact', sans-serif;
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #fff;
        }

        /* Container Tumpuk (Bukan Grid) */
        .ugly-container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tombol Ugal-Ugalan */
        .btn-ugly {
            background: var(--neon-blue);
            color: #fff;
            border: 5px dashed #fff;
            padding: 15px 30px;
            font-family: 'Impact', sans-serif;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            transform: skew(-10deg);
            transition: 0.1s;
            outline: none;
        }

        .btn-ugly:hover {
            background: var(--acid-green);
            transform: skew(-10deg) scale(1.1) rotate(2deg);
            box-shadow: 5px 5px 0px var(--neon-pink);
        }

        /* Kartu Catatan Kacau */
        .note-card {
            background: var(--neon-yellow);
            color: #000;
            border: 3px solid #fff;
            padding: 20px;
            position: relative;
            box-shadow: -10px 10px 0px var(--neon-pink);
            transition: 0.2s;
        }

        .note-card:hover {
            transform: rotate(2deg) translate(5px, -5px);
        }

        .note-card:nth-child(even) {
            background: var(--acid-green);
            transform: rotate(-2deg);
            box-shadow: 10px -10px 0px var(--neon-blue);
        }

        .note-title {
            font-family: 'Impact', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            border-bottom: 2px dotted #000;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .note-desc {
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.4;
        }

        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: red;
            color: yellow;
            border: 3px solid black;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0px black;
        }

        /* Modal Glitch */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: #fff;
            border: 10px solid var(--neon-pink);
            padding: 30px;
            width: 90%;
            max-width: 400px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .ugly-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-family: 'Comic Neue', cursive;
            border: 4px solid var(--neon-blue);
            background: #eee;
        }

        .btn-save {
            background: var(--acid-green);
            width: 100%;
            padding: 15px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Impact', sans-serif;
            font-size: 1.2rem;
            color: black;
        }
        
        /* Marquee Berjalan */
        .marquee {
            background: var(--neon-pink);
            color: #fff;
            padding: 5px;
            font-family: monospace;
            font-size: 1.2rem;
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee p { display: inline-block; animation: scroll 10s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

    </style>
</head>
<body>

    <div class="ugly-header">
        <h1>CATATAN ACAK 💩</h1>
        <p>GAK ADA STYLE, CUMA DATA!</p>
    </div>

    <div class="marquee">
        <p>SELAMAT DATANG DI WEBSITE PALING JESED SEDUNIAA... KLIK TOMBOL BESAR DI BAWAH UNTUK TAMBAH DATA... WASPADA MATA LELAH...</p>
    </div>

    <div class="ugly-container">
        <button class="btn-ugly" onclick="openModal()">[ + ] TAMBAH CATATAN</button>
        
        <div id="uglyGrid">
            <!-- Items go here -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalUgly">
        <div class="modal-box">
            <h2 style="font-family: Impact; font-size: 2rem; margin-bottom: 20px; color: var(--neon-blue);">INPUT DATA!</h2>
            
            <label>JUDUL:</label>
            <input type="text" id="uglyTitle" class="ugly-input" placeholder="TEKS APA AJA...">

            <label>ISI:</label>
            <textarea id="uglyDesc" class="ugly-input" rows="3" placeholder="TULIS SESUKA HATI..."></textarea>

            <button class="btn-save" onclick="saveUgly()">SIMPAN SEKARANG!!!</button>
            <button style="margin-top:10px; width:100%; padding:10px; background:red; color:white; border:none; font-family:Impact; cursor:pointer;" onclick="closeModal()">BATAL</button>
        </div>
    </div>

    <script>
        let uglyData = JSON.parse(localStorage.getItem('uglyData')) || [];

        function renderUgly() {
            const box = document.getElementById('uglyGrid');
            box.innerHTML = '';
            
            uglyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.innerHTML = `
                    <div class="delete-btn" onclick="delUgly(${item.id})">X</div>
                    <div class="note-title">${item.title}</div>
                    <div class="note-desc">${item.desc}</div>
                `;
                box.appendChild(div);
            });
        }

        function openModal() { document.getElementById('modalUgly').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalUgly').style.display = 'none'; }

        function saveUgly() {
            const t = document.getElementById('uglyTitle').value;
            const d = document.getElementById('uglyDesc').value;
            
            if(!t) return;

            uglyData.push({ id: Date.now(), title: t, desc: d });
            localStorage.setItem('uglyData', JSON.stringify(uglyData));
            renderUgly();
            closeModal();
            
            document.getElementById('uglyTitle').value = '';
            document.getElementById('uglyDesc').value = '';
        }

        function delUgly(id) {
            uglyData = uglyData.filter(x => x.id !== id);
            localStorage.setItem('uglyData', JSON.stringify(uglyData));
            renderUgly();
        }

        renderUgly();
    </script>
</body>
</html>
